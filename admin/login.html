<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 登录</title>
    <link rel="stylesheet" href="admin.css">
    <script src="admin.js"></script>
    <style>
        .esp32-auth-section { margin-top: 24px; }
        .divider { text-align: center; position: relative; margin: 16px 0; }
        .divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.15); }
        .divider span { position: relative; background: var(--glass-bg, rgba(255,255,255,0.1)); padding: 0 12px; font-size: 0.85rem; opacity: 0.6; }
        .esp32-auth-btn { display: block; text-align: center; padding: 12px; border-radius: 10px; background: rgba(79,195,247,0.15); border: 1px solid rgba(79,195,247,0.3); color: #4fc3f7; text-decoration: none; font-size: 0.9rem; transition: all 0.3s; }
        .esp32-auth-btn:hover { background: rgba(79,195,247,0.25); }
        .esp32-hint { text-align: center; font-size: 0.78rem; opacity: 0.4; margin-top: 8px; }
    </style>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <h1>化学世界管理后台</h1>
            <p>Chemistry World Admin</p>
        </div>

        <form id="login-form" class="login-form">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="login-btn">登录</button>
        </form>

        <div class="esp32-auth-section">
            <div class="divider"><span>或</span></div>
            <a href="#" id="esp32-auth-link" class="esp32-auth-btn">
                通过 ESP32-S3 硬件认证
            </a>
            <p class="esp32-hint">
                需要设备与 ESP32 在同一 WiFi<br>
                当前设备：<span id="esp32-url">chemworld.local</span>
                · <a href="#" id="esp32-change">改地址</a>
            </p>
        </div>
    </div>

    <script>
        const esp32Link = document.getElementById('esp32-auth-link');
        const esp32UrlLabel = document.getElementById('esp32-url');

        if (typeof AdminSystem !== 'undefined' && AdminSystem.esp32) {
            esp32Link.href = AdminSystem.esp32.authPageUrl();
            esp32UrlLabel.textContent = AdminSystem.esp32.url().replace(/^https?:\/\//, '');
        }

        // mDNS 在某些路由器/系统上不生效，留个手动改地址的入口
        document.getElementById('esp32-change').addEventListener('click', function (e) {
            e.preventDefault();
            const cur = AdminSystem.esp32.url();
            const next = prompt('ESP32 的地址（例如 http://192.168.1.100），留空恢复默认：', cur);
            if (next === null) return;
            AdminSystem.esp32.setUrl(next.trim());
        });

        // 硬件认证回来但凭证过期了，把原因说清楚
        const authError = sessionStorage.getItem('authError');
        if (authError) {
            sessionStorage.removeItem('authError');
            const tip = document.createElement('p');
            tip.className = 'esp32-hint';
            tip.style.color = '#ff8a80';
            tip.style.opacity = '0.9';
            tip.textContent = authError;
            document.querySelector('.esp32-auth-section').appendChild(tip);
        }

        // 已经登录过就别停在登录页，直接进后台
        if (typeof AdminSystem !== 'undefined' && AdminSystem.isLoggedIn()) {
            window.location.replace('index.html');
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = this.querySelector('.login-btn');

            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';

            const success = await AdminSystem.login(username, password);

            if (success) {
                window.location.href = 'index.html';
            } else {
                alert('用户名或密码错误');
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        });
    </script>
</body>
</html>
