<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收藏夹 | Favorites</title>
    <link rel="stylesheet" href="styles.css">
    <script src="interaction.js"></script>
    <style>
        body {
            opacity: 0;
            transform: translateY(50px);
            animation: fadeInUp 0.8s ease-out forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .navbar {
            animation: fadeInUp 0.8s ease-out 0.2s forwards;
            opacity: 0;
            transform: translateY(50px);
        }

        .container {
            animation: fadeInUp 0.8s ease-out 0.4s forwards;
            opacity: 0;
            transform: translateY(50px);
        }

        .favorites-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
        }

        .favorites-toolbar .search-box {
            flex: 1;
            min-width: 200px;
        }

        .favorites-toolbar select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .filter-chip {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-chip.active {
            background: var(--primary-color);
            color: var(--white);
            border-color: var(--primary-color);
        }

        .favorites-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .favorite-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: all 0.3s ease;
        }

        .favorite-card:hover {
            box-shadow: var(--shadow-md);
        }

        .favorite-checkbox {
            padding-top: 4px;
        }

        .favorite-info {
            flex: 1;
            min-width: 0;
        }

        .favorite-info h3 {
            margin: 0 0 8px 0;
            color: var(--text-primary);
        }

        .element-meta {
            display: flex;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }

        .element-symbol {
            font-weight: 700;
            color: var(--primary-color);
        }

        .favorite-note {
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .favorite-note-text {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .favorite-note textarea {
            width: 100%;
            min-height: 60px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--glass-border);
            background: var(--bg-color);
            color: var(--text-primary);
            font-size: 0.85rem;
            resize: vertical;
        }

        .favorite-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .no-favorites {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .no-favorites .btn {
            display: inline-block;
            margin-top: 16px;
        }

        .favorites-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .favorites-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="site-title">
                <img src="photo/loge.png" class="logo" alt="Logo">
                Chemistry World
            </a>
            <ul class="nav-links">
                <li><a href="index.html" data-lang-key="home">首页</a></li>
                <li><a href="elements.html" data-lang-key="elements">元素列表</a></li>
                <li><a href="favorites.html" data-lang-key="favorites">收藏夹</a></li>
                <li><a href="games/chinese/games.html" data-lang-key="games">化学游戏</a></li>
            </ul>
            <div class="apple-taskbar">
                <button class="taskbar-btn" data-lang="chinese">中文</button>
                <button class="taskbar-btn" data-lang="english">English</button>
                <div class="slide-indicator chinese"></div>
            </div>
            <div class="menu-toggle" id="menuToggle">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <div class="container">
        <h1 data-lang-key="favorites-title">我的收藏</h1>

        <div class="favorites-container" id="favorites-container">
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <p>&copy; 2024 Chemistry World. All rights reserved.</p>
    </footer>

    <script>
        const translations = {
            chinese: {
                home: "首页",
                elements: "元素列表",
                favorites: "收藏夹",
                games: "化学游戏",
                "favorites-title": "我的收藏",
                "no-favorites": "暂无收藏元素",
                "no-favorites-desc": "浏览元素列表，点击 ❤️ 按钮添加收藏",
                "remove-favorite": "取消收藏",
                "view-details": "查看详情",
                "search-placeholder": "搜索名称或符号...",
                "sort-number": "按原子序数",
                "sort-name": "按名称",
                "sort-time": "按添加时间",
                "number-label": "原子序数",
                "all": "全部",
                "metal": "金属",
                "nonmetal": "非金属",
                "metalloid": "类金属",
                "noble-gas": "稀有气体",
                "halogen": "卤素",
                "alkali-metal": "碱金属",
                "alkaline-earth-metal": "碱土金属",
                "edit-note": "编辑笔记",
                "save-note": "保存",
                "cancel-note": "取消",
                "note-placeholder": "为这个元素添加笔记...",
                "no-note": "暂无笔记",
                "bulk-remove": "批量取消收藏",
                "export": "导出收藏",
                "import": "导入收藏"
            },
            english: {
                home: "Home",
                elements: "Elements",
                favorites: "Favorites",
                games: "Chemistry Games",
                "favorites-title": "My Favorites",
                "no-favorites": "No favorite elements yet",
                "no-favorites-desc": "Browse elements and click ❤️ to add favorites",
                "remove-favorite": "Remove",
                "view-details": "View details",
                "search-placeholder": "Search name or symbol...",
                "sort-number": "By Atomic Number",
                "sort-name": "By Name",
                "sort-time": "By Added Time",
                "number-label": "No.",
                "all": "All",
                "metal": "Metal",
                "nonmetal": "Nonmetal",
                "metalloid": "Metalloid",
                "noble-gas": "Noble Gas",
                "halogen": "Halogen",
                "alkali-metal": "Alkali Metal",
                "alkaline-earth-metal": "Alkaline Earth Metal",
                "edit-note": "Edit Note",
                "save-note": "Save",
                "cancel-note": "Cancel",
                "note-placeholder": "Add a note for this element...",
                "no-note": "No note",
                "bulk-remove": "Bulk Remove",
                "export": "Export",
                "import": "Import"
            }
        };

        const categoryColors = {
            'metal': '#ef4444',
            'nonmetal': '#10b981',
            'metalloid': '#f59e0b',
            'noble-gas': '#8b5cf6',
            'halogen': '#06b6d4',
            'alkali-metal': '#ec4899',
            'alkaline-earth-metal': '#f97316'
        };

        let currentLang = 'chinese';
        let searchTerm = '';
        let activeFilter = 'all';
        let sortMode = 'number';

        function init() {
            updateLanguageUI();
            loadFavorites();
            setupEventListeners();
        }

        function updateLanguageUI() {
            document.querySelectorAll('[data-lang-key]').forEach(element => {
                const key = element.dataset.langKey;
                if (translations[currentLang][key]) {
                    element.textContent = translations[currentLang][key];
                }
            });

            const gamesLink = document.querySelector('a[data-lang-key="games"]');
            if (gamesLink) {
                gamesLink.href = currentLang === 'chinese' ? 'games/chinese/games.html' : 'games/english/games.html';
            }

            const slideIndicator = document.querySelector('.slide-indicator');
            if (slideIndicator) {
                slideIndicator.className = 'slide-indicator';
                slideIndicator.classList.add(currentLang);
            }
        }

        function getFavorites() {
            try {
                return JSON.parse(localStorage.getItem('favorites') || '[]');
            } catch (e) {
                return [];
            }
        }

        function getNotes() {
            try {
                return JSON.parse(localStorage.getItem('favoriteNotes') || '{}');
            } catch (e) {
                return {};
            }
        }

        function saveNote(elementName, note) {
            const notes = getNotes();
            if (note.trim()) {
                notes[elementName] = note.trim();
            } else {
                delete notes[elementName];
            }
            localStorage.setItem('favoriteNotes', JSON.stringify(notes));
        }

        function getCategoryName(category) {
            const categoryMap = {
                chinese: {
                    metal: '金属', nonmetal: '非金属', metalloid: '类金属',
                    'noble-gas': '稀有气体', 'alkali-metal': '碱金属',
                    'alkaline-earth-metal': '碱土金属', other: '其他'
                },
                english: {
                    metal: 'Metal', nonmetal: 'Nonmetal', metalloid: 'Metalloid',
                    'noble-gas': 'Noble Gas', 'alkali-metal': 'Alkali Metal',
                    'alkaline-earth-metal': 'Alkaline Earth Metal', other: 'Other'
                }
            };
            return categoryMap[currentLang][category] || category;
        }

        function getFilteredAndSortedFavorites() {
            let favorites = getFavorites();

            // 搜索过滤
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                favorites = favorites.filter(item =>
                    item.name.toLowerCase().includes(term) ||
                    item.symbol.toLowerCase().includes(term)
                );
            }

            // 分类过滤
            if (activeFilter !== 'all') {
                favorites = favorites.filter(item => item.category === activeFilter);
            }

            // 排序
            switch (sortMode) {
                case 'number':
                    favorites.sort((a, b) => a.atomicNumber - b.atomicNumber);
                    break;
                case 'name':
                    favorites.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'time':
                    favorites.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
                    break;
            }

            return favorites;
        }

        function renderStats(favorites) {
            const allFavorites = getFavorites();
            const stats = {};
            allFavorites.forEach(item => {
                const cat = item.category || 'other';
                stats[cat] = (stats[cat] || 0) + 1;
            });

            const t = translations[currentLang];
            let html = `<div class="stat-item"><strong>${t['favorites-title']}:</strong> ${allFavorites.length}</div>`;

            for (const [cat, count] of Object.entries(stats)) {
                const color = categoryColors[cat] || '#6b7280';
                html += `<div class="stat-item"><span class="stat-dot" style="background:${color}"></span>${getCategoryName(cat)} ${count}</div>`;
            }

            return html;
        }

        function loadFavorites() {
            const favoritesContainer = document.getElementById('favorites-container');
            if (!favoritesContainer) return;

            try {
                const allFavorites = getFavorites();

                if (allFavorites.length === 0) {
                    favoritesContainer.innerHTML = `
                        <div class="no-favorites">
                            <h3>${translations[currentLang]['no-favorites']}</h3>
                            <p>${translations[currentLang]['no-favorites-desc']}</p>
                            <a href="elements.html" class="btn">${translations[currentLang]['elements']}</a>
                        </div>
                    `;
                    return;
                }

                const t = translations[currentLang];
                const categories = ['all', 'metal', 'nonmetal', 'metalloid', 'noble-gas', 'halogen', 'alkali-metal', 'alkaline-earth-metal'];

                favoritesContainer.innerHTML = `
                    <div class="favorites-toolbar">
                        <input type="text" id="fav-search" class="search-box" placeholder="${t['search-placeholder']}" value="${searchTerm}">
                        <select id="fav-sort">
                            <option value="number" ${sortMode === 'number' ? 'selected' : ''}>${t['sort-number']}</option>
                            <option value="name" ${sortMode === 'name' ? 'selected' : ''}>${t['sort-name']}</option>
                            <option value="time" ${sortMode === 'time' ? 'selected' : ''}>${t['sort-time']}</option>
                        </select>
                    </div>
                    <div class="filter-chips">
                        ${categories.map(cat => `
                            <button class="filter-chip ${activeFilter === cat ? 'active' : ''}" data-filter="${cat}">${t[cat] || cat}</button>
                        `).join('')}
                    </div>
                    <div class="favorites-stats">${renderStats(allFavorites)}</div>
                    <div class="favorites-header">
                        <h3>${t['favorites-title']} (${allFavorites.length})</h3>
                        <div class="favorites-actions">
                            <button class="btn bulk-remove-btn">${t['bulk-remove']}</button>
                            <button class="btn export-btn">${t['export']}</button>
                            <input type="file" id="import-file" style="display:none;" accept=".json">
                            <button class="btn import-btn">${t['import']}</button>
                        </div>
                    </div>
                    <div class="favorites-list"></div>
                `;

                const filtered = getFilteredAndSortedFavorites();
                const favoritesList = favoritesContainer.querySelector('.favorites-list');
                const notes = getNotes();

                if (filtered.length === 0) {
                    favoritesList.innerHTML = `<p style="text-align:center;padding:40px;color:var(--text-secondary);">${currentLang === 'chinese' ? '没有匹配的收藏元素' : 'No matching favorites'}</p>`;
                } else {
                    filtered.forEach(element => {
                        const note = notes[element.name] || '';
                        const favoriteCard = document.createElement('div');
                        favoriteCard.className = 'favorite-card';
                        favoriteCard.dataset.name = element.name;
                        favoriteCard.innerHTML = `
                            <div class="favorite-checkbox">
                                <input type="checkbox" class="favorite-checkbox-input">
                            </div>
                            <div class="favorite-info">
                                <h3>${element.name} <span class="element-symbol">(${element.symbol})</span></h3>
                                <div class="element-meta">
                                    <span>${t['number-label']}: ${element.atomicNumber}</span>
                                    <span>${getCategoryName(element.category)}</span>
                                </div>
                                <div class="favorite-note" data-element="${element.name}">
                                    ${note
                                        ? `<div class="favorite-note-text">${escapeHtml(note)}</div>`
                                        : `<div class="favorite-note-text" style="opacity:0.5">${t['no-note']}</div>`
                                    }
                                </div>
                            </div>
                            <div class="favorite-actions">
                                <button class="btn view-btn">${t['view-details']}</button>
                                <button class="btn note-btn">${t['edit-note']}</button>
                                <button class="btn remove-btn">${t['remove-favorite']}</button>
                            </div>
                        `;
                        favoritesList.appendChild(favoriteCard);

                        const removeBtn = favoriteCard.querySelector('.remove-btn');
                        removeBtn.addEventListener('click', () => removeFavorite(element.name));

                        const viewBtn = favoriteCard.querySelector('.view-btn');
                        viewBtn.addEventListener('click', () => {
                            const link = currentLang === 'chinese'
                                ? `chinese/${element.atomicNumber.toString().padStart(2, '0')}${element.symbol}.html`
                                : `english/${element.atomicNumber}_${element.name}.html`;
                            window.location.href = link;
                        });

                        const noteBtn = favoriteCard.querySelector('.note-btn');
                        const noteContainer = favoriteCard.querySelector('.favorite-note');
                        noteBtn.addEventListener('click', () => toggleNoteEditor(noteContainer, element.name, noteBtn));
                    });
                }

                // 工具栏事件
                const searchInput = favoritesContainer.querySelector('#fav-search');
                searchInput.addEventListener('input', (e) => {
                    searchTerm = e.target.value;
                    refreshList();
                });

                const sortSelect = favoritesContainer.querySelector('#fav-sort');
                sortSelect.addEventListener('change', (e) => {
                    sortMode = e.target.value;
                    refreshList();
                });

                favoritesContainer.querySelectorAll('.filter-chip').forEach(chip => {
                    chip.addEventListener('click', function() {
                        favoritesContainer.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                        this.classList.add('active');
                        activeFilter = this.dataset.filter;
                        refreshList();
                    });
                });

                // 批量操作
                const bulkRemoveBtn = favoritesContainer.querySelector('.bulk-remove-btn');
                bulkRemoveBtn.addEventListener('click', () => {
                    const checked = favoritesContainer.querySelectorAll('.favorite-checkbox-input:checked');
                    if (checked.length === 0) {
                        showToast(currentLang === 'chinese' ? '请选择要取消收藏的元素' : 'Please select elements to remove', 1000);
                        return;
                    }
                    const names = Array.from(checked).map(cb => cb.closest('.favorite-card').dataset.name);
                    bulkRemoveFavorites(names);
                });

                // 导出
                favoritesContainer.querySelector('.export-btn').addEventListener('click', exportFavorites);

                // 导入
                const importBtn = favoritesContainer.querySelector('.import-btn');
                const importFile = favoritesContainer.querySelector('#import-file');
                importBtn.addEventListener('click', () => importFile.click());
                importFile.addEventListener('change', (e) => {
                    if (e.target.files[0]) importFavorites(e.target.files[0]);
                });

            } catch (error) {
                console.error('Error loading favorites:', error);
                favoritesContainer.innerHTML = '<p>加载收藏失败</p>';
            }
        }

        function refreshList() {
            const favoritesContainer = document.getElementById('favorites-container');
            const allFavorites = getFavorites();
            const filtered = getFilteredAndSortedFavorites();
            const favoritesList = favoritesContainer.querySelector('.favorites-list');
            const notes = getNotes();
            const t = translations[currentLang];

            // 更新统计
            favoritesContainer.querySelector('.favorites-stats').innerHTML = renderStats(allFavorites);

            if (filtered.length === 0) {
                favoritesList.innerHTML = `<p style="text-align:center;padding:40px;color:var(--text-secondary);">${currentLang === 'chinese' ? '没有匹配的收藏元素' : 'No matching favorites'}</p>`;
                return;
            }

            favoritesList.innerHTML = '';
            filtered.forEach(element => {
                const note = notes[element.name] || '';
                const favoriteCard = document.createElement('div');
                favoriteCard.className = 'favorite-card';
                favoriteCard.dataset.name = element.name;
                favoriteCard.innerHTML = `
                    <div class="favorite-checkbox">
                        <input type="checkbox" class="favorite-checkbox-input">
                    </div>
                    <div class="favorite-info">
                        <h3>${element.name} <span class="element-symbol">(${element.symbol})</span></h3>
                        <div class="element-meta">
                            <span>${t['sort-number'].replace('按', '').replace('By ', '')}: ${element.atomicNumber}</span>
                            <span>${getCategoryName(element.category)}</span>
                        </div>
                        <div class="favorite-note" data-element="${element.name}">
                            ${note
                                ? `<div class="favorite-note-text">${escapeHtml(note)}</div>`
                                : `<div class="favorite-note-text" style="opacity:0.5">${t['no-note']}</div>`
                            }
                        </div>
                    </div>
                    <div class="favorite-actions">
                        <button class="btn view-btn">${t['view-details']}</button>
                        <button class="btn note-btn">${t['edit-note']}</button>
                        <button class="btn remove-btn">${t['remove-favorite']}</button>
                    </div>
                `;
                favoritesList.appendChild(favoriteCard);

                const removeBtn = favoriteCard.querySelector('.remove-btn');
                removeBtn.addEventListener('click', () => removeFavorite(element.name));

                const viewBtn = favoriteCard.querySelector('.view-btn');
                viewBtn.addEventListener('click', () => {
                    const link = currentLang === 'chinese'
                        ? `chinese/${element.atomicNumber.toString().padStart(2, '0')}${element.symbol}.html`
                        : `english/${element.atomicNumber}_${element.name}.html`;
                    window.location.href = link;
                });

                const noteBtn = favoriteCard.querySelector('.note-btn');
                const noteContainer = favoriteCard.querySelector('.favorite-note');
                noteBtn.addEventListener('click', () => toggleNoteEditor(noteContainer, element.name, noteBtn));
            });
        }

        function toggleNoteEditor(noteContainer, elementName, btn) {
            const t = translations[currentLang];
            const existingNote = getNotes()[elementName] || '';
            const isEditing = noteContainer.querySelector('textarea');

            if (isEditing) {
                return;
            }

            noteContainer.innerHTML = `
                <textarea placeholder="${t['note-placeholder']}">${escapeHtml(existingNote)}</textarea>
                <div style="margin-top:6px;display:flex;gap:6px;">
                    <button class="btn note-save-btn" style="padding:4px 12px;font-size:0.8rem;">${t['save-note']}</button>
                    <button class="btn note-cancel-btn" style="padding:4px 12px;font-size:0.8rem;">${t['cancel-note']}</button>
                </div>
            `;

            noteContainer.querySelector('.note-save-btn').addEventListener('click', () => {
                const text = noteContainer.querySelector('textarea').value;
                saveNote(elementName, text);
                loadFavorites();
                showToast(currentLang === 'chinese' ? '笔记已保存' : 'Note saved', 1000);
            });

            noteContainer.querySelector('.note-cancel-btn').addEventListener('click', () => {
                loadFavorites();
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function removeFavorite(elementName) {
            try {
                let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
                favorites = favorites.filter(item => item.name !== elementName);
                localStorage.setItem('favorites', JSON.stringify(favorites));
                loadFavorites();
                showToast('已取消收藏', 1000);
            } catch (error) {
                console.error('Error removing favorite:', error);
                showToast('操作失败，请重试', 1000);
            }
        }

        function bulkRemoveFavorites(elementNames) {
            try {
                let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
                favorites = favorites.filter(item => !elementNames.includes(item.name));
                localStorage.setItem('favorites', JSON.stringify(favorites));
                loadFavorites();
                showToast(`已取消收藏 ${elementNames.length} 个元素`, 1000);
            } catch (error) {
                console.error('Error bulk removing favorites:', error);
                showToast('操作失败，请重试', 1000);
            }
        }

        function exportFavorites() {
            try {
                const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
                const notes = getNotes();
                const data = { favorites, notes, exportedAt: new Date().toISOString() };
                const dataStr = JSON.stringify(data, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `chemistry-world-favorites-${new Date().toISOString().slice(0, 10)}.json`;
                link.click();
                URL.revokeObjectURL(url);
                showToast('收藏已导出', 1000);
            } catch (error) {
                console.error('Error exporting favorites:', error);
                showToast('导出失败，请重试', 1000);
            }
        }

        function importFavorites(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    let importedFavorites, importedNotes;

                    if (Array.isArray(imported)) {
                        importedFavorites = imported;
                        importedNotes = {};
                    } else if (imported.favorites) {
                        importedFavorites = imported.favorites;
                        importedNotes = imported.notes || {};
                    } else {
                        showToast('导入失败：无效的文件格式', 1000);
                        return;
                    }

                    let existing = JSON.parse(localStorage.getItem('favorites') || '[]');
                    const existingNames = new Set(existing.map(item => item.name));
                    const newFavs = importedFavorites.filter(item => !existingNames.has(item.name));
                    existing = [...existing, ...newFavs];
                    localStorage.setItem('favorites', JSON.stringify(existing));

                    let existingNotes = getNotes();
                    Object.assign(existingNotes, importedNotes);
                    localStorage.setItem('favoriteNotes', JSON.stringify(existingNotes));

                    loadFavorites();
                    showToast(`成功导入 ${newFavs.length} 个收藏`, 1000);
                } catch (error) {
                    console.error('Error importing favorites:', error);
                    showToast('导入失败，请检查文件格式', 1000);
                }
            };
            reader.readAsText(file);
        }

        function showToast(message, duration) {
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:white;padding:12px 24px;border-radius:24px;z-index:1000;transition:opacity 0.3s ease;opacity:0;';
                document.body.appendChild(toast);
            }
            toast.textContent = message;
            toast.style.opacity = '1';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, duration);
        }

        function setupEventListeners() {
            const menuToggle = document.getElementById('menuToggle');
            const navLinks = document.querySelector('.nav-links');
            if (menuToggle && navLinks) {
                menuToggle.addEventListener('click', () => {
                    navLinks.classList.toggle('active');
                });
            }

            const taskbarBtns = document.querySelectorAll('.taskbar-btn');
            taskbarBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const newLang = this.dataset.lang;
                    if (newLang === currentLang) return;
                    currentLang = newLang;
                    updateLanguageUI();
                    loadFavorites();
                });
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
