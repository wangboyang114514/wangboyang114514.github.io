; Chemistry World ESP32-S3 硬件认证服务
; 板子：ESP32-S3-DevKitC-1（8MB Flash）
; 烧录：pio run -t upload    看串口：pio device monitor

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ArduinoJson 7 —— 6.x 的 StaticJsonDocument 在 7.x 里已经移除，别往下降
lib_deps = bblanchon/ArduinoJson@^7.0.0

monitor_speed = 115200
; 崩了直接看到调用栈函数名，不用手动 addr2line
monitor_filters = time, esp32_exception_decoder
; 打开串口时不复位、不拉 DTR，方便一边跑一边看
monitor_rts = 0
monitor_dtr = 0

board_build.partitions = default.csv
upload_speed = 921600
build_flags = -DCORE_DEBUG_LEVEL=1
